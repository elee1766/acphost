name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubicloud-standard-2-ubuntu-2604
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # Sandbox integration tests need bwrap and unprivileged user
      # namespaces, which Ubuntu 24.04 restricts through AppArmor.
      - name: bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt nftables uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # TestSandboxPastaDNS runs a fake resolver on 127.0.0.77:53.
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=53
          # TestUsernsSandboxRootMode maps the agent to a subuid.
          grep -q "^$USER:" /etc/subuid || sudo usermod --add-subuids 200000-265535 "$USER"
          grep -q "^$USER:" /etc/subgid || sudo usermod --add-subgids 200000-265535 "$USER"
          # Ubuntu's bwrap-userns-restrict profile denies capabilities to
          # what bwrap runs, so the in-sandbox id switch (#162) gets EPERM.
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
      # Each test step writes go test -json to test-<step>.json and prints
      # the full output from it unfiltered: a grep here once hid the real
      # TestSandboxPastaDNS error (#131, #178). rc keeps the test exit code.
      - name: sandbox tests
        run: |
          go test -json -race -v -run 'TestSandbox|TestUserns' ./... > test-sandbox.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test-sandbox.json
          exit "${rc:-0}"
      # Pasta tests have flaked on master after passing once on their PR
      # (#131-#133). Five more runs make a flake fail the PR that adds it.
      - name: pasta tests x5
        if: success() || failure()
        run: |
          go test -json -race -count=5 -run 'TestSandboxPasta' ./... > test-pasta.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test-pasta.json
          exit "${rc:-0}"
      # Cgroup integration tests need a delegated cgroup with memory and
      # pids. P is owned by the runner and holds no processes, so it can
      # enable controllers. The shell moves into the leaf P/test, so P is
      # the common ancestor for moving the agent into P/<session>.
      - name: cgroup tests
        if: success() || failure()
        run: |
          P=/sys/fs/cgroup/acphost-ci
          sudo mkdir $P $P/test
          echo '+memory +pids' | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          echo '+memory +pids' | sudo tee $P/cgroup.subtree_control >/dev/null
          sudo chown -R "$(id -u):$(id -g)" $P
          echo $$ | sudo tee $P/test/cgroup.procs >/dev/null
          ACPHOST_TEST_CGROUP=$P go test -json -race -count=1 -v -run 'TestCgroup|TestMatrix|TestNoFields' ./... > test-cgroup.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test-cgroup.json
          exit "${rc:-0}"
      # The systemd cgroup driver tests (#226) need a user manager and
      # must run in its cgroup tree: moving a process into a scope needs
      # write access to the common ancestor's cgroup.procs. Linger starts
      # user@<uid>.service; systemd-run --user --scope puts the test in
      # it. The socket file exists before the manager answers: on a
      # runner the first call once waited the full 30s start timeout, so
      # wait until the manager is up (running or degraded) first. The
      # tests run three times so a start-up race shows. needSystemd skips
      # (and this step would pass vacuously) when the manager or the
      # cgroup tree is missing, so the step checks the tests ran.
      - name: systemd cgroup tests
        if: success() || failure()
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          for i in $(seq 100); do [ -S "$XDG_RUNTIME_DIR/systemd/private" ] && break; sleep 0.2; done
          timeout 120 systemctl --user is-system-running --wait || true
          systemctl --user is-system-running || true
          systemd-run --user --scope --quiet --collect env PATH="$PATH" HOME="$HOME" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            go test -json -race -count=3 -v -run 'TestSystemd' ./... > test-systemd.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test-systemd.json
          if jq -e 'select(.Action == "skip" and .Test != null)' test-systemd.json >/dev/null; then
            echo "systemd tests skipped"; exit 1
          fi
          exit "${rc:-0}"
      # The tests above ran already; -skip keeps them from running twice.
      - name: other tests
        if: success() || failure()
        run: |
          go test -json -race -skip 'TestSandbox|TestUserns|TestCgroup|TestMatrix|TestNoFields|TestSystemd' ./... > test-other.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test-other.json
          exit "${rc:-0}"
      # failed-tests.json is what `jobshop report ci-failures` reads: a
      # list of {package, test} for each failed test across the steps.
      - name: list failed tests
        if: failure()
        run: |
          cat test-*.json 2>/dev/null | jq -s '[.[] | select(.Action == "fail" and .Test != null) | {package: .Package, test: .Test}] | unique' > failed-tests.json
          cat failed-tests.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-tests
          path: failed-tests.json
          if-no-files-found: ignore
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  # go test ./... must give the same verdict on a host without the
  # isolation binaries (#281, #284): each test passes or skips. The
  # binaries are installed as in the go job, then hidden: the tests run
  # with PATH set to a dir of symlinks to only go, sh and the tools the
  # test scripts call. CGO_ENABLED=0 since cgo and -race would need gcc
  # and binutils on PATH; the go job covers -race. A second run adds
  # only newuidmap and newgidmap: a host with some isolation binaries
  # reaches code that one with none skips early (#292).
  minimal-path:
    runs-on: ubicloud-standard-2-ubuntu-2604
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: isolation setup
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap passt nftables uidmap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The newuidmap-only run reaches the subid tests (#292).
          grep -q "^$USER:" /etc/subuid || sudo usermod --add-subuids 200000-265535 "$USER"
          grep -q "^$USER:" /etc/subgid || sudo usermod --add-subgids 200000-265535 "$USER"
      - name: minimal PATH
        run: |
          # Under /tmp, mode 755: the subid tests' agents run as a
          # subordinate uid that cannot traverse $RUNNER_TEMP (#292).
          d=/tmp/minpath
          mkdir -p -m 755 "$d"
          ln -s "$(go env GOROOT)/bin/go" "$d/go"
          for c in sh cat echo env grep head id ls mkdir readlink rm sed seq setsid sleep touch tr true; do
            ln -s "$(command -v "$c")" "$d/$c"
          done
          echo "MINPATH=$d" >> "$GITHUB_ENV"
          u=/tmp/minpath-userns
          cp -a "$d" "$u"
          ln -s "$(command -v newuidmap)" "$u/newuidmap"
          ln -s "$(command -v newgidmap)" "$u/newgidmap"
          echo "MINPATH_USERNS=$u" >> "$GITHUB_ENV"
          echo "PATH used: $d"
          ls -l "$d"
          bad=0
          for c in newuidmap newgidmap bwrap pasta nsenter; do
            echo "$c on runner PATH: $(command -v "$c" || echo none)"
            if p=$(PATH=$d; command -v "$c"); then
              echo "$c found on minimal PATH: $p"; bad=1
            else
              echo "$c absent from minimal PATH"
            fi
          done
          exit "$bad"
      - name: tests
        run: |
          export GOCACHE=$(go env GOCACHE) GOMODCACHE=$(go env GOMODCACHE)
          CGO_ENABLED=0 PATH=$MINPATH go test -json -count=1 ./... > test-minpath.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test-minpath.json
          exit "${rc:-0}"
      - name: tests with newuidmap only
        if: success() || failure()
        run: |
          echo "PATH used: $MINPATH_USERNS"
          ls -l "$MINPATH_USERNS"
          export GOCACHE=$(go env GOCACHE) GOMODCACHE=$(go env GOMODCACHE)
          CGO_ENABLED=0 PATH=$MINPATH_USERNS go test -json -count=1 ./... > test-minpath-userns.json || rc=$?
          jq -j 'select(.Action == "output") | .Output' test-minpath-userns.json
          exit "${rc:-0}"
